openapi: 3.0.3
info:
  title: Scheduler API
  version: 1.0.0
  description: |
    Domain-agnostic scheduling. A requester discovers free slots on a resource
    and reserves one.

    * All timestamps are RFC 3339 with an explicit offset.
    * All intervals are half-open: [starts_at, ends_at).
    * Identifiers are integers, unique within a tenant (ADR-0008).
    * Every request is scoped to a tenant by the `X-Tenant-ID` header (ADR-0009).
      The header is unauthenticated, so it is routing, not isolation.

    In the original trainer vocabulary, `resource_id` is the trainer and
    `requester_id` is the client.
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: availability
  - name: bookings

paths:
  /v1/resources/{resource_id}/availability:
    get:
      tags: [availability]
      summary: List bookable slots for a resource in a window
      operationId: listAvailability
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
        - name: starts_at
          in: query
          required: true
          schema: { type: string, format: date-time }
          example: '2030-01-07T00:00:00-08:00'
        - name: ends_at
          in: query
          required: true
          description: Exclusive. Must be after starts_at. The window is capped by the service's max_horizon_days.
          schema: { type: string, format: date-time }
          example: '2030-01-12T00:00:00-08:00'
        - name: service_id
          in: query
          description: Defaults to the resource's default service.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Slots in ascending order. May be empty; an empty window is not an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/bookings:
    post:
      tags: [bookings]
      summary: Create a booking
      operationId: createBooking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '200':
          description: Idempotent replay. The booking already created with this Idempotency-Key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: The slot is already taken for this resource (code slot_unavailable).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            Well-formed but violates a rule. `code` is one of
            outside_business_hours, misaligned_start, invalid_duration,
            starts_in_past, insufficient_notice, beyond_horizon (scheduling rules);
            resource_inactive, service_required (the resource cannot be booked);
            idempotency_key_reuse (the Idempotency-Key was used for a different
            request).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/bookings/{booking_id}:
    get:
      tags: [bookings]
      summary: Fetch one booking
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: booking_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/resources/{resource_id}/bookings:
    get:
      tags: [bookings]
      summary: List a resource's bookings
      operationId: listResourceBookings
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
        - name: starts_at
          in: query
          description: Only bookings ending after this instant.
          schema: { type: string, format: date-time }
        - name: ends_at
          in: query
          description: Only bookings starting before this instant.
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque. Pass the previous response's next_cursor.
          schema: { type: string }
      responses:
        '200':
          description: Bookings in ascending start order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingList' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: false
      description: |
        The tenant to scope the request to (ADR-0009). Optional only because a
        deployment may configure a default tenant; otherwise a missing header is
        a 400 (missing_tenant) and an unknown tenant a 404 (unknown_tenant).
      schema: { type: integer, format: int64, minimum: 1 }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated. A repeat with the same key returns the original booking.
      schema: { type: string, maxLength: 255 }

  responses:
    Problem:
      description: Error. RFC 9457 problem detail; branch on `code`, never on `detail`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Slot:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    Availability:
      type: object
      required: [resource_id, service_id, timezone, slots]
      properties:
        resource_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        timezone: { type: string, example: America/Los_Angeles }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    CreateBookingRequest:
      type: object
      required: [resource_id, requester_id, starts_at, ends_at]
      properties:
        resource_id: { type: integer, format: int64 }
        requester_id: { type: integer, format: int64 }
        service_id:
          type: integer
          format: int64
          description: Defaults to the resource's default service.
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        meeting_url:
          type: string
          format: uri
          nullable: true
          description: Supplied by the caller. This service does not provision meetings.
        metadata:
          type: object
          additionalProperties: true

    Booking:
      type: object
      required: [id, resource_id, requester_id, service_id, starts_at, ends_at, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        resource_id: { type: integer, format: int64 }
        requester_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, cancelled] }
        meeting_url: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        next_cursor:
          type: string
          nullable: true

    Problem:
      description: RFC 9457 problem detail, extended with a stable `code`.
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable identifier. Branch on this, not on `detail`.
